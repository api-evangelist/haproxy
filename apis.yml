  - aid: haproxy:haproxy-runtime-api
    name: HAProxy Runtime API
    description: >-
      The HAProxy Runtime API (formerly known as the stats socket) is a
      socket-based interface for dynamically managing HAProxy at runtime. It
      allows operators to enable or disable servers, adjust weights, inspect
      stick tables, view statistics, and perform other live configuration
      changes without reloading the process. Its native transport is a UNIX socket or a
      TCP/IP socket, not HTTP; the baseURL recorded here is the HTTP passthrough the Data
      Plane API exposes for 26 of these operations under /v3/services/haproxy/runtime.
    humanURL: https://www.haproxy.com/documentation/haproxy-runtime-api/
    baseURL: http://{haproxy-host}:5555/v3/services/haproxy/runtime
    tags:
      - Load Balancing
      - Runtime Management
      - Statistics
    properties:
      - type: Documentation
        url: https://www.haproxy.com/documentation/haproxy-runtime-api/
      - type: Reference
        url: https://www.haproxy.com/documentation/haproxy-runtime-api/reference/
  - aid: haproxy:haproxy-kubernetes-ingress-controller
    name: HAProxy Kubernetes Ingress Controller
    description: >-
      The HAProxy Kubernetes Ingress Controller implements routing rules defined
      in Kubernetes Ingress resources, dynamically updating HAProxy configuration
      as pods are added or removed from the cluster. It supports the Gateway API,
      custom resources, and certificate management via the HAProxy Runtime API. It has no
      standalone HTTP API of its own: its interface is the Kubernetes API server, where it
      registers custom resources under the ingress.v3.haproxy.org (and legacy
      ingress.v1.haproxy.org) API groups.
    humanURL: https://www.haproxy.com/documentation/kubernetes-ingress/
    baseURL: https://{kubernetes-api-server}/apis/ingress.v3.haproxy.org/v3
    tags:
      - Ingress Controller
      - Kubernetes
      - Load Balancing
    properties:
      - type: Documentation
        url: https://www.haproxy.com/documentation/kubernetes-ingress/
      - type: GettingStarted

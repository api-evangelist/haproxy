aid: haproxy
name: HAProxy
description: >-
  HAProxy is a free, very fast and reliable reverse-proxy offering high
  availability, load balancing, and proxying for TCP and HTTP-based
  applications. It exposes a Data Plane API for dynamic configuration
  management and a stats socket for runtime management.

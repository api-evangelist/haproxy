aid: haproxy
name: HAProxy
description: >-
  HAProxy is a free, very fast and reliable reverse-proxy offering high
  availability, load balancing, and proxying for TCP and HTTP-based
  applications. It exposes a Data Plane API for dynamic configuration
  management and a stats socket for runtime management.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Load Balancing
  - Reverse Proxy
  - High Availability
  - Networking
url: >-
  https://raw.githubusercontent.com/api-evangelist/haproxy/refs/heads/main/apis.yml
created: '2026-03-16'
modified: '2026-03-16'
specificationVersion: '0.19'
apis:
  - aid: haproxy:haproxy-data-plane-api
    name: HAProxy Data Plane API
    description: >-
      The HAProxy Data Plane API is a REST API for managing HAProxy
      configuration dynamically. It allows runtime configuration of
      frontends, backends, servers, ACLs, and other HAProxy objects
      without requiring configuration file changes or restarts.
    humanURL: https://www.haproxy.com/documentation/dataplaneapi/latest/
    baseURL: https://localhost:5555/v2
    tags:
      - Load Balancing
      - Configuration
      - REST API
    properties:
      - type: Documentation
        url: https://www.haproxy.com/documentation/dataplaneapi/latest/

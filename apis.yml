apis:
  - aid: haproxy:haproxy-data-plane-api
    name: HAProxy Data Plane API
    description: >-
      The HAProxy Data Plane API is a REST API for managing HAProxy
      configuration dynamically. It allows runtime configuration of
      frontends, backends, servers, ACLs, and other HAProxy objects
      without requiring configuration file changes or restarts.
    humanURL: https://www.haproxy.com/documentation/dataplaneapi/latest/
    baseURL: http://{haproxy-host}:5555/v3
    tags:
      - Configuration
      - Load Balancing
      - REST API
    properties:

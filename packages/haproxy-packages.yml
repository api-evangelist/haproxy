description: >-
  HAProxy Technologies distributes its client libraries and runnable artifacts as Go
  modules, Helm charts and container images rather than as conventional per-language
  SDK packages. There is no first-party JavaScript, Python, Ruby, Java or .NET client
  for the Data Plane API; the Go client-native library is the reference client and is
  what the Data Plane API itself is built on.

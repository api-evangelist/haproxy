    official: true
    version: v6.4.1
    published: '2026-07-29'
    note: >-
      The first-party Go client for HAProxy configuration and the Runtime API. This
      module also carries the canonical Data Plane API specification at
      specification/build/haproxy_spec.yaml, which is the spec harvested into openapi/.

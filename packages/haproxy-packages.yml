    official: true
    version: v1.2.5
    published: '2020-04-15'
    note: >-
      DECAY SIGNAL WITH A KNOWN CAUSE, not abandonment. proxy.golang.org resolves
      @latest to v1.2.5 (2020-04-15) because releases from v2 onward were tagged
      without the /v2, /v3 module-path suffix Go requires, so the module proxy cannot
      see them. The project itself is actively released: v3.4.2 shipped 2026-08-14
      (https://github.com/haproxytech/dataplaneapi/releases). Consumers must pin by
      commit or build from source rather than `go get` the latest tag.

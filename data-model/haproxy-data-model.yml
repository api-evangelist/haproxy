runtime_projection:
  detail: >-
    26 paths under /v3/services/haproxy/runtime/ expose the LIVE state of the same entities
    — runtime servers, ACL contents, stick tables, SSL CA and CRL files, ACME. These are
    the same objects seen through the Runtime API rather than the configuration file, and
    they are not transactional.
statistics:
  detail: >-
    /v3/services/haproxy/stats/native (getStats) returns per-process, per-frontend,
    per-backend and per-server counters. This is the read-only telemetry projection of the
    graph.

description: >-
  Entity graph for the HAProxy Data Plane API, derived from the 232 definitions and 223
  paths of the harvested contract. The model is not a typical SaaS object graph: it is a
  direct projection of an HAProxy configuration file. Entities are configuration SECTIONS,
  identity is a NAME within a parent section rather than an opaque id, and ordered rule
  lists are addressed by INDEX — which is the single most important thing an automated
  client has to understand, because deleting a rule renumbers its siblings.
identity:
  scheme: name-within-parent
  detail: >-
    There are no opaque, prefixed resource ids anywhere in this API. A backend is addressed
    by its name; a server is addressed by name under a parent backend name; an HTTP request
    rule is addressed by its integer index under a parent frontend or backend. Nothing is
    globally unique on its own — `parent_name` plus `name` (or `index`) is the key.
  path_parameters:
    name: The section or object name as written in the HAProxy configuration.
    parent_name: The enclosing section — a backend, frontend, defaults, peers or ring.
    index: Zero-based position within an ordered rule list.
  warning: >-
    Index-addressed collections are position-dependent. Deleting rule index 2 shifts every
    later rule down by one, so an agent holding a list of indices must re-read the
    collection after any delete rather than replaying stale indices.

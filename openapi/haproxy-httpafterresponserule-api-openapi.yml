openapi: 3.2.0
info:
  title: HAProxy Data Plane HTTP After Response Rule API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: HTTPAfterResponseRule
paths:
  /services/haproxy/configuration/backends/{parent_name}/http_after_response_rules:
    get:
      description: Returns all HTTP After Response Rules that are configured in specified parent.
      operationId: getAllHTTPAfterResponseRuleBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http_after_response_rules'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of all HTTP After Response Rules
      tags:
      - HTTPAfterResponseRule
    put:
      description: Replaces a whole list of HTTP After Response Rules with the list given in parameter
      operationId: replaceAllHTTPAfterResponseRuleBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All TTP After Response Rules lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http_after_response_rules'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http_after_response_rules'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace an HTTP After Response Rules list
      tags:
      - HTTPAfterResponseRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/http_after_response_rules'
        required: true

openapi: 3.2.0
info:
  title: HAProxy Data Plane Peer Entry API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: PeerEntry
paths:
  /services/haproxy/configuration/peer_entries:
    get:
      description: Returns an array of all peer_entries that are configured in specified peer section.
      operationId: getPeerEntries
      parameters:
      - description: Parent peer section name
        in: query
        name: peer_section
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/peer_entries'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of peer_entries
      tags:
      - PeerEntry
    post:
      description: Adds a new peer entry in the specified peer section in the configuration file.
      operationId: createPeerEntry
      parameters:
      - description: Parent peer section name
        in: query
        name: peer_section
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: PeerEntry created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/peer_entry'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/peer_entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new peer_entry
      tags:
      - PeerEntry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/peer_entry'
        required: true
  /services/haproxy/configuration/peer_entries/{name}:
    delete:
      description: Deletes a peer entry configuration by it's name in the specified peer section.
      operationId: deletePeerEntry
      parameters:
      - description: PeerEntry name
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Parent peers name
        in: query
        name: peer_section
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
        '204':
          description: PeerEntry deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a peer_entry
      tags:
      - PeerEntry
    get:
      description: Returns one peer_entry configuration by it's name in the specified peer section.
      operationId: getPeerEntry
      parameters:
      - description: PeerEntry name
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Parent peers name
        in: query
        name: peer_section
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/peer_entry'
        '404':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one peer_entry
      tags:
      - PeerEntry
    put:
      description: Replaces a peer entry configuration by it's name in the specified peer section.
      operationId: replacePeerEntry
      parameters:
      - description: PeerEntry name
        in: path
        name: name
        required: true
        schema:
          type: string
      - description: Parent peers name
        in: query
        name: peer_section
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: PeerEntry replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/peer_entry'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/peer_entry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a peer_entry
      tags:
      - PeerEntry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/peer_entry'
        required: true
components:
  parameters:
    transaction_id:
      name: transaction_id
      in: query
      description: ID of the transaction where we want to add the operation. Cannot be used when version is specified.
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version used for checking configuration version. Cannot be used when transaction is specified, transaction has it's own version.
      required: false
      schema:
        type: integer
    force_reload:
      name: force_reload
      in: query
      description: If set, do a force reload, do not wait for the configured reload-delay. Cannot be used when transaction is specified, as changes in transaction are not applied directly to configuration.
      required: false
      schema:
        type: boolean
        default: false
  schemas:
    error:
      additionalProperties:
        type: string
      description: API Error
      properties:
        code:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      title: Error
      type: object
    peer_entry:
      description: Peer Entry from peers table
      properties:
        address:
          pattern: ^[^\s]+$
          type: string
        metadata:
          additionalProperties:
            type: object
        name:
          pattern: ^[A-Za-z0-9-_.:${}"]+$
          type: string
        port:
          maximum: 65535
          minimum: 1
          type:
          - integer
          - 'null'
        shard:
          type: integer
      required:
      - name
      - address
      - port
      title: Peer Entry
      type: object
    peer_entries:
      title: Peer entries
      description: HAProxy peer entries array
      type: array
      items:
        $ref: '#/components/schemas/peer_entry'
  responses:
    DefaultError:
      description: General Error
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    NotFound:
      description: The specified resource was not found
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    BadRequest:
      description: Bad request
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    AlreadyExists:
      description: The specified resource already exists
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
externalDocs:
  url: https://docs.haproxy.org/
  description: HAProxy Documentation

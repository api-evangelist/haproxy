components:
  parameters:
    transaction_id:
      name: transaction_id
      in: query
      description: ID of the transaction where we want to add the operation. Cannot be used when version is specified.
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version used for checking configuration version. Cannot be used when transaction is specified, transaction has it's own version.
      required: false
      schema:
        type: integer
    parent_name:
      name: parent_name
      in: path
      description: Parent name
      required: true
      schema:
        type: string
        pattern: ^[^\r\n<>*;$#&{}"]+$
    force_reload:
      name: force_reload
      in: query
      description: If set, do a force reload, do not wait for the configured reload-delay. Cannot be used when transaction is specified, as changes in transaction are not applied directly to configuration.
      required: false
      schema:
        type: boolean
        default: false
  schemas:
    error:
      additionalProperties:
        type: string
      description: API Error
      properties:
        code:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      title: Error
      type: object
    http_check:
      properties:
        addr:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              value: connect
        alpn:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              value: connect
          x-display-name: ALPN Protocols
        body:
          type: string
          x-dependency:
            type:
              value: send
        body_log_format:
          type: string
          x-dependency:
            type:
              value: send
        check_comment:
          type: string
          x-dependency:
            type:
              value:
              - comment
              - connect
              - expect
              - send
        default:
          type: boolean
          x-dependency:
            type:
              value: connect
        error_status:
          enum:
          - L7OKC
          - L7RSP
          - L7STS
          - L6RSP
          - L4CON
          type: string
          x-dependency:
            type:
              value: expect
        exclamation_mark:
          type: boolean
          x-dependency:
            type:
              value: expect
          x-display-name: Expect Exclamation Mark
        headers:
          items:
            $ref: '#/components/schemas/return_header'
          type: array
          x-dependency:
            type:
              value: send
          x-go-name: CheckHeaders
          x-omitempty: true
        linger:
          type: boolean
          x-dependency:
            type:
              value: connect
        match:
          enum:
          - status
          - rstatus
          - hdr
          - fhdr
          - string
          - rstring
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              required: true
              value: expect
          x-display-name: Expect Match
        metadata:
          additionalProperties:
            type: object
        method:
          enum:
          - HEAD
          - PUT
          - POST
          - GET
          - TRACE
          - PATCH
          - DELETE
          - CONNECT
          - OPTIONS
          type: string
          x-dependency:
            type:
              value: send
        min_recv:
          type:
          - integer
          - 'null'
          x-dependency:
            type:
              value: expect
        ok_status:
          enum:
          - L7OK
          - L7OKC
          - L6OK
          - L4OK
          type: string
          x-dependency:
            type:
              value: expect
        on_error:
          type: string
          x-dependency:
            type:
              value: expect
        on_success:
          type: string
          x-dependency:
            type:
              value: expect
        pattern:
          type: string
          x-dependency:
            type:
              required: true
              value: expect
        port:
          maximum: 65535
          minimum: 1
          type:
          - integer
          - 'null'
          x-dependency:
            type:
              value: connect
        port_string:
          type: string
          x-dependency:
            type:
              value: connect
        proto:
          type: string
          x-dependency:
            type:
              value: connect
        send_proxy:
          type: boolean
          x-dependency:
            type:
              value: connect
        sni:
          type: string
          x-dependency:
            type:
              value: connect
        ssl:
          type: boolean
          x-dependency:
            type:
              value: connect
        status-code:
          type: string
          x-dependency:
            type:
              value: expect
        tout_status:
          enum:
          - L7TOUT
          - L6TOUT
          - L4TOUT
          type: string
          x-dependency:
            type:
              value: expect
        type:
          enum:
          - comment
          - connect
          - disable-on-404
          - expect
          - send
          - send-state
          - set-var
          - set-var-fmt
          - unset-var
          type: string
        uri:
          type: string
          x-dependency:
            type:
              value: send
        uri_log_format:
          type: string
          x-dependency:
            type:
              value: send
        var_expr:
          type: string
          x-dependency:
            type:
              required: true
              value:
              - set-var
          x-display-name: Var Expression
        var_format:
          type: string
          x-dependency:
            type:
              required: true
              value:
              - set-var-fmt
          x-display-name: Var Format
        var_name:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              required: true
              value:
              - set-var
              - set-var-fmt
              - unset-var
        var_scope:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              required: true
              value:
              - set-var
              - set-var-fmt
              - unset-var
        version:
          type: string
          x-dependency:
            type:
              value: send
        via_socks4:
          type: boolean
          x-dependency:
            type:
              value: connect
      required:
      - type
      title: HTTP Check
      type: object

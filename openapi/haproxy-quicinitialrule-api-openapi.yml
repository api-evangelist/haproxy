openapi: 3.2.0
info:
  title: HAProxy Data Plane QUIC Initial Rule API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: QUICInitialRule
paths:
  /services/haproxy/configuration/frontends/{parent_name}/quic_initial_rules:
    get:
      description: Returns all QUIC Initial rules that are configured in specified parent.
      operationId: getAllQUICInitialRuleFrontend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rules'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of all QUIC Initial rules
      tags:
      - QUICInitialRule
    put:
      description: Replaces a whole list of QUIC Initial rules with the list given in parameter
      operationId: replaceAllQUICInitialRuleFrontend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All TTP After Response Rules lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rules'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rules'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace an QUIC Initial rules list
      tags:
      - QUICInitialRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/quic_initial_rules'
        required: true
  /services/haproxy/configuration/defaults/{parent_name}/quic_initial_rules:
    get:
      description: Returns all QUIC Initial rules that are configured in specified parent.
      operationId: getAllQUICInitialRuleDefaults
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rules'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of all QUIC Initial rules
      tags:
      - QUICInitialRule
    put:
      description: Replaces a whole list of QUIC Initial rules with the list given in parameter
      operationId: replaceAllQUICInitialRuleDefaults
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All TTP After Response Rules lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rules'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rules'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace an QUIC Initial rules list
      tags:
      - QUICInitialRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/quic_initial_rules'
        required: true
  /services/haproxy/configuration/frontends/{parent_name}/quic_initial_rules/{index}:
    delete:
      description: Deletes a QUIC Initial Rule configuration by it's index from the specified parent.
      operationId: deleteQUICInitialRuleFrontend
      parameters:
      - description: QUIC Initial Rule Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
        '204':
          description: QUIC Initial Rule deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a QUIC Initial Rule
      tags:
      - QUICInitialRule
    get:
      description: Returns one QUIC Initial Rule configuration by it's index in the specified parent.
      operationId: getQUICInitialRuleFrontend
      parameters:
      - description: QUIC Initial Rule Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rule'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one QUIC Initial Rule
      tags:
      - QUICInitialRule
    post:
      description: Adds a new QUIC Initial Rule of the specified type in the specified parent.
      operationId: createQUICInitialRuleFrontend
      parameters:
      - description: QUIC Initial Rule Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: HTTP Response Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rule'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new QUIC Initial Rule
      tags:
      - QUICInitialRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/quic_initial_rule'
        required: true
    put:
      description: Replaces a QUIC Initial Rule configuration by it's index in the specified parent.
      operationId: replaceQUICInitialRuleFrontend
      parameters:
      - description: QUIC Initial Rule Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: QUIC Initial Rule replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rule'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/quic_initial_rule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a QUIC Initial Rule
      tags:
      - QUICInitialRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/quic_initial_rule'
        required: true
  /services/haproxy/configuration/defaults/{parent_name}/quic_initial_rules/{index}:

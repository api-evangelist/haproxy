              description: ID of the requested reload
              schema:
                type: string
        '204':
          description: Bind deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a bind
      tags:
      - Bind
    get:
      description: Returns one bind configuration by it's name in the specified frontend.
      operationId: getBindLogForward
      parameters:
      - description: Bind name
        in: path
        name: name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '404':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one bind
      tags:
      - Bind
    put:
      description: Replaces a bind configuration by it's name in the specified frontend.
      operationId: replaceBindLogForward
      parameters:
      - description: Bind name
        in: path
        name: name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: Bind replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a bind
      tags:
      - Bind
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bind'
        required: true
  /services/haproxy/configuration/peers/{parent_name}/binds/{name}:
    delete:
      description: Deletes a bind configuration by it's name in the specified frontend.
      operationId: deleteBindPeer
      parameters:
      - description: Bind name
        in: path
        name: name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '202':
          description: Configuration change accepted and reload requested

openapi: 3.2.0
info:
  title: HAProxy Data Plane Bind API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: Bind
  description: Managing frontend bind configurations (advanced mode)
paths:
  /services/haproxy/configuration/frontends/{parent_name}/binds:
    get:
      description: Returns an array of all binds that are configured in specified frontend.
      operationId: getAllBindFrontend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/binds'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of binds
      tags:
      - Bind
    post:
      description: Adds a new bind in the specified frontend in the configuration file.
      operationId: createBindFrontend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Bind created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new bind
      tags:
      - Bind
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bind'
        required: true
  /services/haproxy/configuration/log_forwards/{parent_name}/binds:
    get:
      description: Returns an array of all binds that are configured in specified frontend.
      operationId: getAllBindLogForward
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/binds'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of binds
      tags:
      - Bind
    post:
      description: Adds a new bind in the specified frontend in the configuration file.
      operationId: createBindLogForward
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Bind created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new bind
      tags:
      - Bind
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bind'
        required: true
  /services/haproxy/configuration/peers/{parent_name}/binds:
    get:
      description: Returns an array of all binds that are configured in specified frontend.
      operationId: getAllBindPeer
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/binds'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of binds
      tags:
      - Bind
    post:
      description: Adds a new bind in the specified frontend in the configuration file.
      operationId: createBindPeer
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Bind created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new bind
      tags:
      - Bind
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bind'
        required: true
  /services/haproxy/configuration/frontends/{parent_name}/binds/{name}:
    delete:
      description: Deletes a bind configuration by it's name in the specified frontend.
      operationId: deleteBindFrontend
      parameters:
      - description: Bind name
        in: path
        name: name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
        '204':
          description: Bind deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a bind
      tags:
      - Bind
    get:
      description: Returns one bind configuration by it's name in the specified frontend.
      operationId: getBindFrontend
      parameters:
      - description: Bind name
        in: path
        name: name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '404':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one bind
      tags:
      - Bind
    put:
      description: Replaces a bind configuration by it's name in the specified frontend.
      operationId: replaceBindFrontend
      parameters:
      - description: Bind name
        in: path
        name: name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: Bind replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bind'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a bind
      tags:
      - Bind
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/bind'
        required: true
  /services/haproxy/configuration/log_forwards/{parent_name}/binds/{name}:
    delete:
      description: Deletes a bind configuration by it's name in the specified frontend.
      operationId: deleteBindLogForward
      parameters:
      - description: Bind name
        in: path
        name: name

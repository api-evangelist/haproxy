        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one TCP Request Rule
      tags:
      - TCPRequestRule
    post:
      description: Adds a new TCP Request Rule of the specified type in the specified parent.
      operationId: createTCPRequestRuleBackend
      parameters:
      - description: TCP Request Rule Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: TCP Request Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tcp_request_rule'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:

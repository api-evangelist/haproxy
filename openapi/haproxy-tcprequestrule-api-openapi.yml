components:
  parameters:
    transaction_id:
      name: transaction_id
      in: query
      description: ID of the transaction where we want to add the operation. Cannot be used when version is specified.
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version used for checking configuration version. Cannot be used when transaction is specified, transaction has it's own version.
      required: false
      schema:
        type: integer
    parent_name:
      name: parent_name
      in: path
      description: Parent name
      required: true
      schema:
        type: string
        pattern: ^[^\r\n<>*;$#&{}"]+$
    force_reload:
      name: force_reload
      in: query
      description: If set, do a force reload, do not wait for the configured reload-delay. Cannot be used when transaction is specified, as changes in transaction are not applied directly to configuration.
      required: false
      schema:
        type: boolean
        default: false
  schemas:
    tcp_request_rule:
      additionalProperties: false
      description: HAProxy TCP Request Rule configuration (corresponds to tcp-request)
      example:
        cond: if
        cond_test: '{ src 192.168.0.0/16 }'
        index: 0
        type: connection
      properties:
        action:
          enum:
          - accept
          - attach-srv
          - capture
          - do-resolve
          - expect-netscaler-cip
          - expect-proxy
          - lua
          - reject
          - sc-add-gpc
          - sc-inc-gpc
          - sc-inc-gpc0
          - sc-inc-gpc1
          - sc-set-gpt
          - sc-set-gpt0
          - send-spoe-group
          - set-bandwidth-limit
          - set-bc-mark
          - set-bc-tos
          - set-dst-port
          - set-dst
          - set-fc-mark
          - set-fc-tos
          - set-log-level
          - set-mark
          - set-nice
          - set-priority-class
          - set-priority-offset
          - set-src
          - set-src-port
          - set-tos
          - set-var
          - set-var-fmt
          - silent-drop
          - switch-mode
          - track-sc
          - unset-var
          - use-service
          - set-retries
          - do-log
          type: string
          x-dependency:
            type:
              required: true
              value:
              - connection
              - content
              - session
        bandwidth_limit_limit:
          type: string
          x-dependency:
            action:
              value: set-bandwidth-limit
            type:
              value: content
          x-display-name: Standard HAProxy expression
        bandwidth_limit_name:
          type: string
          x-dependency:
            action:
              value: set-bandwidth-limit
            type:
              value: content
          x-display-name: Bandwidth limit name
        bandwidth_limit_period:
          type: string
          x-dependency:
            action:
              value: set-bandwidth-limit
            type:
              value: content
          x-display-name: Standard HAProxy expression
        capture_len:
          type: integer
          x-dependency:
            action:
              required: true
              value: capture
            type:
              required: true
              value:
              - connection
              - content
          x-display-name: Capture Length
        capture_sample:
          pattern: ^(?:[A-Za-z]+\("([A-Za-z\s]+)"\)|[A-Za-z]+)
          type: string
          x-dependency:
            action:
              required: true
              value: capture
            type:
              required: true
              value:
              - connection
              - content
          x-display-name: Capture Sample
        cond:
          enum:
          - if
          - unless
          type: string
          x-dependency:
            type:
              value:
              - connection
              - content
              - session
          x-display-name: Condition
        cond_test:
          type: string
          x-dependency:
            cond:
              required: true
            type:
              required: true
              value:
              - connection
              - content
              - session
          x-display-name: Condition Test
          x-dynamic-enum:
            freeFormat: true
            operation: getACLs
            property: acl_name
        expr:
          type: string
          x-dependency:
            action:
              required: true
              value:
              - do-resolve
              - set-bc-mark
              - set-bc-tos
              - set-dst
              - set-dst-port
              - set-fc-mark
              - set-fc-tos
              - set-priority-class
              - set-priority-offset
              - set-src
              - set-src-port
              - set-var
              - set-retries
            type:
              value:
              - session
              - connection
              - content
          x-display-name: Standard HAProxy expression
        gpt_value:
          type: string
          x-dependency:
            action:
              required: true
              value: sc-set-gpt0
            type:
              required: true
              value:
              - connection
              - content
              - session
          x-display-name: Sticky counter value
        log_level:
          enum:
          - emerg
          - alert
          - crit
          - err
          - warning
          - notice
          - info
          - debug
          - silent
          type: string
          x-dependency:
            action:
              required: true
              value: set-log-level
            type:
              value: content
        log_profile:
          type: string
          x-dependency:
            action:
              value: do-log
          x-display-name: Log Profile
        lua_action:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            action:
              required: true
              value: lua
            type:
              value:
              - connection
              - content
          x-display-name: Lua action name
        lua_params:
          type: string
          x-dependency:
            action:
              value: lua
            type:
              value:
              - connection
              - content
          x-display-name: Lua action params
        mark_value:
          pattern: ^(0x[0-9A-Fa-f]+|[0-9]+)$
          type: string
          x-dependency:
            action:
              required: true
              value: set-mark
            type:
              value:
              - connection
              - content
          x-display-name: Mark Value

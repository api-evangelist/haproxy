openapi: 3.2.0
info:
  title: HAProxy Data Plane TCP Request Rule API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: TCPRequestRule
paths:
  /services/haproxy/configuration/backends/{parent_name}/tcp_request_rules:
    get:
      description: Returns all TCP Request Rules that are configured in specified parent and parent type.
      operationId: getAllTCPRequestRuleBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tcp_request_rules'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of all TCP Request Rules
      tags:
      - TCPRequestRule
    put:
      description: Replaces a whole list of TCP Request Rules with the list given in parameter
      operationId: replaceAllTCPRequestRuleBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All TCP Request Rule lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tcp_request_rules'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tcp_request_rules'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace an TCP Request Rule list
      tags:
      - TCPRequestRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tcp_request_rules'
        required: true

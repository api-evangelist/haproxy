components:
  parameters:
    transaction_id:
      name: transaction_id
      in: query
      description: ID of the transaction where we want to add the operation. Cannot be used when version is specified.
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version used for checking configuration version. Cannot be used when transaction is specified, transaction has it's own version.
      required: false
      schema:
        type: integer
    parent_name:
      name: parent_name
      in: path
      description: Parent name
      required: true
      schema:
        type: string
        pattern: ^[^\r\n<>*;$#&{}"]+$
    force_reload:
      name: force_reload
      in: query
      description: If set, do a force reload, do not wait for the configured reload-delay. Cannot be used when transaction is specified, as changes in transaction are not applied directly to configuration.
      required: false
      schema:
        type: boolean
        default: false
  schemas:
    error:
      additionalProperties:
        type: string
      description: API Error
      properties:
        code:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      title: Error
      type: object
    http_response_rules:
      title: HTTP Response Rules Array
      description: HAProxy HTTP response rules array (corresponds to http-response directives)
      type: array
      items:
        $ref: '#/components/schemas/http_response_rule'
    return_header:
      properties:
        fmt:
          type: string
        name:
          type: string
      required:
      - name
      - fmt
      type: object
      x-go-name: ReturnHeader
    http_response_rule:
      additionalProperties: false
      description: HAProxy HTTP response rule configuration (corresponds to http-response directives)
      example:
        cond: unless
        cond_test: '{ src 192.168.0.0/16 }'
        hdr_format: '%T'
        hdr_name: X-Haproxy-Current-Date
        index: 0
        type: add-header
      properties:
        acl_file:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              required: true
              value:
              - add-acl
              - del-acl
        acl_keyfmt:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              required: true
              value:
              - add-acl
              - del-acl
          x-display-name: ACK Key Format
        bandwidth_limit_limit:
          type: string
          x-dependency:
            type:
              value: set-bandwidth-limit
          x-display-name: Standard HAProxy expression
        bandwidth_limit_name:
          type: string
          x-dependency:
            type:
              value: set-bandwidth-limit
          x-display-name: Bandwidth limit name
        bandwidth_limit_period:
          type: string
          x-dependency:
            type:
              value: set-bandwidth-limit
          x-display-name: Standard HAProxy expression
        cache_name:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              required: true
              value: cache-store
          x-display-name: Cache Name
        capture_id:
          type:
          - integer
          - 'null'
          x-dependency:
            type:
              required: true
              value: capture
          x-display-name: Capture SlotID
        capture_sample:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              required: true
              value: capture
          x-display-name: Capture Sample
        cond:
          enum:
          - if
          - unless
          type: string
          x-display-name: Condition
        cond_test:
          type: string
          x-dependency:
            cond:
              required: true
          x-display-name: Condition Test
          x-dynamic-enum:
            freeFormat: true
            operation: getACLs
            property: acl_name
        deny_status:
          maximum: 599
          minimum: 200
          type:
          - integer
          - 'null'
          x-dependency:
            type:
              value: deny
        expr:
          type: string
          x-dependency:
            type:
              required: true
              value:
              - pause
              - set-fc-mark
              - set-fc-tos
          x-display-name: Standard HAProxy expression
        hdr_expr:
          type: string
          x-dependency:
            type:
              required: true
              value:
              - add-headers-bin
              - del-headers-bin
              - set-headers-bin
          x-display-name: Binary Headers Expression
        hdr_format:
          type: string
          x-dependency:
            type:
              required: true
              value:
              - replace-header
              - replace-value
              - set-header
              - add-header
          x-display-name: Header Format
        hdr_match:
          type: string
          x-dependency:
            type:
              required: true
              value:
              - replace-header
              - replace-value
          x-display-name: Header Match
        hdr_method:
          type: string
          x-dependency:
            type:
              value:
              - del-header
              - del-headers-bin
          x-display-name: Header Match Method
        hdr_name:
          type: string
          x-dependency:
            type:
              required: true
              value:
              - add-header
              - replace-header
              - del-header
              - set-header
              - replace-value
          x-display-name: Header Name
        hdr_prefix:
          type: string
          x-dependency:
            type:
              value:
              - add-headers-bin
              - set-headers-bin
          x-display-name: Binary Headers Prefix
        log_level:
          enum:
          - emerg
          - alert
          - crit
          - err
          - warning
          - notice
          - info
          - debug
          - silent
          type: string
          x-dependency:
            type:
              required: true
              value: set-log-level
        log_profile:
          type: string
          x-dependency:
            type:
              value: do-log
          x-display-name: Log Profile
        lua_action:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            type:
              required: true
              value: lua
        lua_params:

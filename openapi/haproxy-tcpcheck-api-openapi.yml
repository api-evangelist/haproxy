openapi: 3.2.0
info:
  title: HAProxy Data Plane TCP Check API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: TCPCheck
paths:
  /services/haproxy/configuration/backends/{parent_name}/tcp_checks:
    get:
      description: Returns all TCP checks that are configured in specified parent.
      operationId: getAllTCPCheckBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tcp_checks'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of TCP checks
      tags:
      - TCPCheck
    put:
      description: Replaces a whole list of TCP Checks with the list given in parameter
      operationId: replaceAllTCPCheckBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All TCP Check lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tcp_checks'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tcp_checks'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace an TCP Check list
      tags:
      - TCPCheck
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tcp_checks'
        required: true
  /services/haproxy/configuration/defaults/{parent_name}/tcp_checks:
    get:
      description: Returns all TCP checks that are configured in specified parent.

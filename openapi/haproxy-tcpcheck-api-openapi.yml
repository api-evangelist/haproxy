components:
  parameters:
    transaction_id:
      name: transaction_id
      in: query
      description: ID of the transaction where we want to add the operation. Cannot be used when version is specified.
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version used for checking configuration version. Cannot be used when transaction is specified, transaction has it's own version.
      required: false
      schema:
        type: integer
    parent_name:
      name: parent_name
      in: path
      description: Parent name
      required: true
      schema:
        type: string
        pattern: ^[^\r\n<>*;$#&{}"]+$
    force_reload:
      name: force_reload
      in: query
      description: If set, do a force reload, do not wait for the configured reload-delay. Cannot be used when transaction is specified, as changes in transaction are not applied directly to configuration.
      required: false
      schema:
        type: boolean
        default: false
  schemas:
    error:
      additionalProperties:
        type: string
      description: API Error
      properties:
        code:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      title: Error
      type: object
    tcp_checks:
      title: TCP Checks Array
      type: array
      items:
        $ref: '#/components/schemas/tcp_check'
    tcp_check:
      properties:
        action:
          enum:
          - comment
          - connect
          - expect
          - send
          - send-lf
          - send-binary
          - send-binary-lf
          - set-var
          - set-var-fmt
          - unset-var
          type: string
        addr:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            action:
              value: connect
        alpn:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            action:
              value: connect
          x-display-name: ALPN Protocols
        check_comment:
          type: string
          x-dependency:
            action:
              value:
              - connect
              - expect
              - send
              - send-lf
              - send-binary
              - send-binary-lf
        data:
          type: string
          x-dependency:
            action:
              required: true
              value: send
        default:
          type: boolean
          x-dependency:
            action:
              value: connect
        error_status:
          enum:
          - L7OKC
          - L7RSP
          - L7STS
          - L6RSP
          - L4CON
          type: string
          x-dependency:
            action:
              value: expect
        exclamation_mark:
          type: boolean
          x-dependency:
            action:
              value: expect
          x-display-name: Expect Exclamation Mark
        fmt:
          type: string
          x-dependency:
            action:
              required: true
              value: send-lf
        hex_fmt:
          type: string
          x-dependency:
            action:
              required: true
              value: send-binary-lf
        hex_string:
          type: string
          x-dependency:
            action:
              required: true
              value: send-binary
        linger:
          type: boolean
          x-dependency:
            action:
              value: connect
        match:
          enum:
          - string
          - rstring
          - string-lf
          - binary
          - rbinary
          - binary-lf
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            action:
              required: true
              value: expect
          x-display-name: Expect Match
        metadata:
          additionalProperties:
            type: object
        min_recv:
          type: integer
          x-dependency:
            action:
              value: expect
        ok_status:
          enum:
          - L7OK
          - L7OKC
          - L6OK
          - L4OK
          type: string
          x-dependency:
            action:
              value: expect
        on_error:
          type: string
          x-dependency:
            action:
              value: expect
        on_success:
          type: string
          x-dependency:
            action:
              value: expect
        pattern:
          type: string
          x-dependency:
            action:
              required: true
              value: expect
        port:
          maximum: 65535
          minimum: 1
          type:
          - integer
          - 'null'
          x-dependency:
            action:
              value: connect
        port_string:
          type: string
          x-dependency:
            action:
              value: connect
        proto:
          type: string
          x-dependency:
            action:
              value: connect
        send_proxy:
          type: boolean
          x-dependency:
            action:
              value: connect
        sni:
          type: string
          x-dependency:
            action:
              value: connect
        ssl:
          type: boolean
          x-dependency:
            action:
              value: connect
        status-code:
          type: string
          x-dependency:
            action:
              value: expect
        tout_status:
          enum:
          - L7TOUT
          - L6TOUT
          - L4TOUT
          type: string
          x-dependency:
            action:
              value: expect
        var_expr:
          type: string
          x-dependency:
            action:
              required: true
              value:
              - set-var
          x-display-name: Var Expression
        var_fmt:
          type: string
          x-dependency:
            action:
              required: true
              value:
              - set-var-fmt
          x-display-name: Var Log format
        var_name:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            action:
              required: true
              value:
              - set-var
              - set-var-fmt
              - unset-var
        var_scope:
          pattern: ^[^\s]+$
          type: string
          x-dependency:
            action:
              required: true
              value:
              - set-var
              - set-var-fmt
              - unset-var
        via_socks4:
          type: boolean
          x-dependency:
            action:
              value: connect
      required:
      - action
      title: TCP Check
      type: object
  responses:
    DefaultError:
      description: General Error
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    NotFound:
      description: The specified resource was not found
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:

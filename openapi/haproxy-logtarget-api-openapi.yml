openapi: 3.2.0
info:
  title: HAProxy Data Plane Log Target API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: LogTarget
paths:
  /services/haproxy/configuration/global/log_targets:
    get:
      description: Returns all Log Targets that are configured in specified parent.
      operationId: getAllLogTargetGlobal
      parameters:
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/log_targets'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of all Log Targets
      tags:
      - LogTarget
    put:
      description: Replaces a whole list of Log Targets with the list given in parameter
      operationId: replaceAllLogTargetGlobal
      parameters:
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All Log Target lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/log_targets'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/log_targets'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a Log Target list
      tags:
      - LogTarget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/log_targets'
        required: true
  /services/haproxy/configuration/global/log_targets/{index}:
    delete:
      description: Deletes a Log Target configuration by it's index from the specified parent.
      operationId: deleteLogTargetGlobal
      parameters:
      - description: Log Target Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
        '204':
          description: Log Target deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a Log Target
      tags:
      - LogTarget
    get:
      description: Returns one Log Target configuration by it's index in the specified parent.
      operationId: getLogTargetGlobal
      parameters:
      - description: Log Target Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/log_target'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one Log Target
      tags:
      - LogTarget
    post:
      description: Adds a new Log Target of the specified type in the specified parent.
      operationId: createLogTargetGlobal
      parameters:
      - description: Log Target Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Log Target created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/log_target'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/log_target'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new Log Target
      tags:
      - LogTarget
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/log_target'
        required: true
    put:
      description: Replaces a Log Target configuration by it's index in the specified parent.
      operationId: replaceLogTargetGlobal
      parameters:
      - description: Log Target Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: Log Target replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/log_target'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:

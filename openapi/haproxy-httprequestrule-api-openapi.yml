          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http_request_rule'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one HTTP Request Rule
      tags:
      - HTTPRequestRule
    post:
      description: Adds a new HTTP Request Rule of the specified type in the specified parent.
      operationId: createHTTPRequestRuleBackend
      parameters:
      - description: HTTP Request Rule Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: HTTP Request Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http_request_rule'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/http_request_rule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':

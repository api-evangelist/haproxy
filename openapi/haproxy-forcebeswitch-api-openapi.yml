openapi: 3.2.0
info:
  title: HAProxy Data Plane Force Be Switch API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: ForceBeSwitch
paths:
  /services/haproxy/configuration/frontends/{parent_name}/force_be_switches:
    get:
      description: Returns all force-be-switch rules configured on the specified frontend.
      operationId: getAllForceBeSwitches
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/force_be_switches'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of force-be-switch rules
      tags:
      - ForceBeSwitch
    post:
      description: Adds a new force-be-switch rule on the specified frontend.
      operationId: createForceBeSwitch
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: ForceBeSwitch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/force_be_switch'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/force_be_switch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new force-be-switch rule
      tags:
      - ForceBeSwitch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/force_be_switch'
        required: true
  /services/haproxy/configuration/frontends/{parent_name}/force_be_switches/{index}:
    delete:
      description: Deletes a force-be-switch rule by its index on the specified frontend.
      operationId: deleteForceBeSwitch
      parameters:
      - description: ForceBeSwitch index (zero-based)
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
        '204':
          description: ForceBeSwitch deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a force-be-switch rule
      tags:
      - ForceBeSwitch
    get:
      description: Returns a single force-be-switch rule by its index on the specified frontend.
      operationId: getForceBeSwitch
      parameters:
      - description: ForceBeSwitch index (zero-based)
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/force_be_switch'
        '404':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one force-be-switch rule
      tags:
      - ForceBeSwitch
    put:
      description: Replaces a force-be-switch rule by its index on the specified frontend.
      operationId: replaceForceBeSwitch
      parameters:
      - description: ForceBeSwitch index (zero-based)
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: ForceBeSwitch replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/force_be_switch'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/force_be_switch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a force-be-switch rule
      tags:
      - ForceBeSwitch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/force_be_switch'
        required: true
components:
  schemas:
    force_be_switch:
      description: 'Allow content switching to select a backend instance even if it is

        disabled or unpublished. May appear multiple times on a frontend.

        '
      properties:
        cond:
          enum:
          - if
          - unless
          type: string
          x-display-name: Condition
        cond_test:
          type: string
          x-dependency:
            cond:
              required: true
          x-display-name: Condition Test
        metadata:
          additionalProperties:
            type: object
      required:
      - cond
      - cond_test
      title: Force Backend Switch Rule
      type: object
      x-go-name: ForceBeSwitch
    error:
      additionalProperties:
        type: string
      description: API Error
      properties:
        code:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      title: Error
      type: object
    force_be_switches:
      type: array
      items:
        $ref: '#/components/schemas/force_be_switch'
      x-omitempty: true
      x-go-name: ForceBeSwitches
  parameters:
    transaction_id:
      name: transaction_id
      in: query
      description: ID of the transaction where we want to add the operation. Cannot be used when version is specified.
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version used for checking configuration version. Cannot be used when transaction is specified, transaction has it's own version.
      required: false
      schema:
        type: integer
    parent_name:
      name: parent_name
      in: path
      description: Parent name
      required: true
      schema:
        type: string
        pattern: ^[^\r\n<>*;$#&{}"]+$
    force_reload:
      name: force_reload
      in: query
      description: If set, do a force reload, do not wait for the configured reload-delay. Cannot be used when transaction is specified, as changes in transaction are not applied directly to configuration.
      required: false
      schema:
        type: boolean
        default: false
  responses:
    DefaultError:
      description: General Error
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    NotFound:
      description: The specified resource was not found
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    BadRequest:
      description: Bad request
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    AlreadyExists:
      description: The specified resource already exists
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
externalDocs:
  url: https://docs.haproxy.org/
  description: HAProxy Documentation

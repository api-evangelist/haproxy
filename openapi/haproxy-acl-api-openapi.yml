openapi: 3.2.0
info:
  title: HAProxy Data Plane ACL API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: ACL
paths:
  /services/haproxy/configuration/backends/{parent_name}/acls:
    get:
      description: Returns all ACL lines that are configured in specified parent.
      operationId: getAllAclBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - description: ACL name
        in: query
        name: acl_name
        schema:
          type: string
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/acls'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of all ACL lines
      tags:
      - ACL
    put:
      description: Replaces a whole list of ACLs with the list given in parameter
      operationId: replaceAllAclBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All ACL lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/acls'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/acls'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace an ACL list
      tags:
      - ACL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/acls'
        required: true

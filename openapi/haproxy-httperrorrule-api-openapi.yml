components:
  parameters:
    transaction_id:
      name: transaction_id
      in: query
      description: ID of the transaction where we want to add the operation. Cannot be used when version is specified.
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version used for checking configuration version. Cannot be used when transaction is specified, transaction has it's own version.
      required: false
      schema:
        type: integer
    parent_name:
      name: parent_name
      in: path
      description: Parent name
      required: true
      schema:
        type: string
        pattern: ^[^\r\n<>*;$#&{}"]+$
    force_reload:
      name: force_reload
      in: query
      description: If set, do a force reload, do not wait for the configured reload-delay. Cannot be used when transaction is specified, as changes in transaction are not applied directly to configuration.
      required: false
      schema:
        type: boolean
        default: false
  schemas:
    error:
      additionalProperties:
        type: string
      description: API Error
      properties:
        code:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      title: Error
      type: object
    return_header:
      properties:
        fmt:
          type: string
        name:
          type: string
      required:
      - name
      - fmt
      type: object
      x-go-name: ReturnHeader
    http_error_rule:
      additionalProperties: false
      description: HAProxy HTTP error rule configuration (corresponds to http-error directives)
      example:
        index: 0
        status: 425
        type: status
      properties:
        metadata:
          additionalProperties:
            type: object
        return_content:
          type: string
          x-dependency:
            return_content_format:
              required: true
              value:
              - errofile
              - errorfiles
              - file
              - lf-file
              - string
              - lf-string
        return_content_format:
          enum:
          - default-errorfiles
          - errorfile
          - errorfiles
          - file
          - lf-file
          - string
          - lf-string
          type: string
          x-dependency:
            type:
              value: status
        return_content_type:
          type:
          - string
          - 'null'
          x-dependency:
            type:
              value: status
          x-display-name: Return content type
        return_hdrs:
          items:
            $ref: '#/components/schemas/return_header'
          type: array
          x-dependency:
            return_content_format:
              value:
              - file
              - lf-file
              - string
              - lf-string
          x-go-name: ReturnHeaders
          x-omitempty: true
        status:
          enum:
          - 200
          - 400
          - 401
          - 403
          - 404
          - 405
          - 407
          - 408
          - 410
          - 413
          - 425
          - 429
          - 500
          - 501
          - 502
          - 503
          - 504
          type: integer
          x-dependency:
            type:
              required: true
              value: status
        type:
          enum:
          - status
          type: string
      required:
      - type
      - status
      title: HTTP Error Rule
      type: object
    http_error_rules:
      title: HTTP Error Rules Array
      description: HAProxy HTTP error rules array (corresponds to http-error directives)
      type: array
      items:
        $ref: '#/components/schemas/http_error_rule'
  responses:
    DefaultError:
      description: General Error
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    NotFound:
      description: The specified resource was not found
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    BadRequest:
      description: Bad request
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
    AlreadyExists:
      description: The specified resource already exists
      headers:
        Configuration-Version:
          description: Configuration file version
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
  securitySchemes:
    basic_auth:
      type: http
      scheme: basic
externalDocs:
  url: https://docs.haproxy.org/
  description: HAProxy Documentation

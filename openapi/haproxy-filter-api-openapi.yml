openapi: 3.2.0
info:
  title: HAProxy Data Plane Filter API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: Filter
paths:
  /services/haproxy/configuration/backends/{parent_name}/filters:
    get:
      description: Returns all Filters that are configured in specified parent.
      operationId: getAllFilterBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filters'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of all Filters
      tags:
      - Filter
    put:
      description: Replaces a whole list of Filters with the list given in parameter
      operationId: replaceAllFilterBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All Filter lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filters'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filters'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a Filter list
      tags:
      - Filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filters'
        required: true
  /services/haproxy/configuration/frontends/{parent_name}/filters:
    get:
      description: Returns all Filters that are configured in specified parent.
      operationId: getAllFilterFrontend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filters'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of all Filters
      tags:
      - Filter
    put:
      description: Replaces a whole list of Filters with the list given in parameter
      operationId: replaceAllFilterFrontend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: All Filter lines replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filters'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filters'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a Filter list
      tags:
      - Filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filters'
        required: true
  /services/haproxy/configuration/backends/{parent_name}/filters/{index}:
    delete:
      description: Deletes a Filter configuration by it's index from the specified parent.
      operationId: deleteFilterBackend
      parameters:
      - description: Filter Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
        '204':
          description: Filter deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a Filter
      tags:
      - Filter
    get:
      description: Returns one Filter configuration by it's index in the specified parent.
      operationId: getFilterBackend
      parameters:
      - description: Filter Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one Filter
      tags:
      - Filter
    post:
      description: Adds a new Filter of the specified type in the specified parent.
      operationId: createFilterBackend
      parameters:
      - description: Filter Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Filter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new Filter
      tags:
      - Filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filter'
        required: true
    put:
      description: Replaces a Filter configuration by it's index in the specified parent.
      operationId: replaceFilterBackend
      parameters:
      - description: Filter Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: Filter replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace a Filter
      tags:
      - Filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filter'
        required: true
  /services/haproxy/configuration/frontends/{parent_name}/filters/{index}:
    delete:
      description: Deletes a Filter configuration by it's index from the specified parent.
      operationId: deleteFilterFrontend
      parameters:
      - description: Filter Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
        '204':
          description: Filter deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Delete a Filter
      tags:
      - Filter
    get:
      description: Returns one Filter configuration by it's index in the specified parent.
      operationId: getFilterFrontend
      parameters:
      - description: Filter Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one Filter
      tags:
      - Filter
    post:
      description: Adds a new Filter of the specified type in the specified parent.
      operationId: createFilterFrontend
      parameters:
      - description: Filter Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Filter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new Filter
      tags:
      - Filter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/filter'
        required: true
    put:
      description: Replaces a Filter configuration by it's index in the specified parent.
      operationId: replaceFilterFrontend
      parameters:
      - description: Filter Index
        in: path
        name: index
        required: true
        schema:
          type: integer
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '200':
          description: Filter replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/filter'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'

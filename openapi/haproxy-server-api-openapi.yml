openapi: 3.2.0
info:
  title: HAProxy Data Plane Server API
  description: 'API for editing and managing haproxy instances. Provides process information, configuration management,

    haproxy stats and logs.'
  version: '3.4'
  contact:
    name: HAProxy Support
    url: https://my.haproxy.com/portal/cust/login
    email: support@haproxy.com
servers:
- url: /v3
security:
- basic_auth: []
tags:
- name: Server
  description: Managing backend server configurations (advanced mode)
paths:
  /services/haproxy/configuration/backends/{parent_name}/servers:
    get:
      description: Returns an array of all servers that are configured in specified backend.
      operationId: getAllServerBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servers'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of servers
      tags:
      - Server
    post:
      description: Adds a new server in the specified backend in the configuration file.
      operationId: createServerBackend
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Server created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new server
      tags:
      - Server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server'
        required: true
  /services/haproxy/configuration/peers/{parent_name}/servers:
    get:
      description: Returns an array of all servers that are configured in specified backend.
      operationId: getAllServerPeer
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:
              description: Configuration file version
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servers'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of servers
      tags:
      - Server
    post:
      description: Adds a new server in the specified backend in the configuration file.
      operationId: createServerPeer
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Server created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Add a new server
      tags:
      - Server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server'
        required: true
  /services/haproxy/configuration/rings/{parent_name}/servers:
    get:
      description: Returns an array of all servers that are configured in specified backend.
      operationId: getAllServerRing
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      responses:
        '200':
          description: Successful operation
          headers:
            Configuration-Version:

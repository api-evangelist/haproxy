  /services/haproxy/runtime/backends/{parent_name}/servers:
    get:
      description: Returns an array of all servers' runtime settings.
      operationId: getAllRuntimeServer
      parameters:
      - $ref: '#/components/parameters/parent_name'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtime_servers'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of runtime servers' settings
      tags:
      - Server
    post:
      description: Adds a new server to the specified backend
      operationId: addRuntimeServer
      parameters:
      - $ref: '#/components/parameters/parent_name'
      responses:
        '201':
          description: Server added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtime_add_server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyExists'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Adds a new server to a backend
      tags:
      - Server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/runtime_add_server'
        required: true
  /services/haproxy/runtime/backends/{parent_name}/servers/{name}:
    delete:
      description: Deletes a server from the specified backend
      operationId: deleteRuntimeServer
      parameters:
      - description: Server name
        in: path
        name: name
        required: true
        schema:
          type: string
          pattern: ^[^\r\n<>*;$#&{}"]+$
      - $ref: '#/components/parameters/parent_name'
      responses:
        '204':
          description: Server deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Deletes a server from a backend
      tags:
      - Server
    get:
      description: Returns one server runtime settings by it's name in the specified backend.
      operationId: getRuntimeServer
      parameters:
      - description: Server name
        in: path
        name: name
        required: true
        schema:
          type: string
          pattern: ^[^\r\n<>*;$#&{}"]+$
      - $ref: '#/components/parameters/parent_name'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtime_server'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return one server runtime settings
      tags:
      - Server
    put:
      description: Replaces a server transient settings by it's name in the specified backend.
      operationId: replaceRuntimeServer
      parameters:
      - description: Server name
        in: path
        name: name
        required: true
        schema:
          type: string
          pattern: ^[^\r\n<>*;$#&{}"]+$
      - $ref: '#/components/parameters/parent_name'
      responses:
        '200':
          description: Server transient settings replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/runtime_server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Replace server transient settings
      tags:
      - Server
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/runtime_server'
        required: true
components:
  parameters:
    transaction_id:
      name: transaction_id
      in: query
      description: ID of the transaction where we want to add the operation. Cannot be used when version is specified.
      required: false
      schema:
        type: string
    version:
      name: version
      in: query
      description: Version used for checking configuration version. Cannot be used when transaction is specified, transaction has it's own version.
      required: false
      schema:
        type: integer
    parent_name:
      name: parent_name
      in: path
      description: Parent name
      required: true
      schema:
        type: string
        pattern: ^[^\r\n<>*;$#&{}"]+$
    force_reload:
      name: force_reload
      in: query
      description: If set, do a force reload, do not wait for the configured reload-delay. Cannot be used when transaction is specified, as changes in transaction are not applied directly to configuration.
      required: false
      schema:
        type: boolean
        default: false
  schemas:
    error:
      additionalProperties:
        type: string
      description: API Error
      properties:
        code:
          type:
          - integer
          - 'null'
        message:
          type:
          - string
          - 'null'
      required:
      - code
      - message
      title: Error
      type: object
    runtime_servers:
      title: HAProxy Runtime Servers Array
      description: HAProxy runtime servers array
      type: array
      items:
        $ref: '#/components/schemas/runtime_server'
    servers:
      title: Servers
      description: HAProxy backend servers array
      type: array
      items:
        $ref: '#/components/schemas/server'
    runtime_add_server:
      description: Settable properties when adding a new server using HAProxy's runtime.
      properties:
        address:
          pattern: ^[^\s]+$
          readOnly: true
          type: string
        agent-addr:
          pattern: ^[^\s]+$
          type: string
        agent-check:
          enum:
          - enabled
          - disabled
          type: string
          x-dependency:
            agent-port:
              required: true
        agent-inter:
          minimum: 0
          type:
          - integer
          - 'null'
          x-default-unit: ms
          x-duration: true
        agent-port:
          maximum: 65535
          minimum: 1
          type:
          - integer
          - 'null'
        agent-send:
          type: string
        allow_0rtt:
          type: boolean
        alpn:
          pattern: ^[^\s]+$
          type: string
          x-display-name: ALPN Protocols
        backup:
          enum:
          - enabled
          - disabled
          type: string
        check:
          enum:
          - enabled
          - disabled
          type: string
        check-send-proxy:
          enum:
          - enabled
          - disabled
          type: string
        check-sni:
          pattern: ^[^\s]+$
          type: string
        check-ssl:
          enum:
          - enabled
          - disabled
          type: string
        check_alpn:
          pattern: ^[^\s]+$
          type: string
          x-display-name: Protocols
        check_proto:
          pattern: ^[^\s]+$
          type: string
          x-display-name: Name
        check_via_socks4:
          enum:
          - enabled
          - disabled
          type: string
        ciphers:
          type: string
          x-dependency:
            ssl:
              value: enabled
        ciphersuites:
          type: string
          x-dependency:
            ssl:
              value: enabled
        crl_file:
          type: string
          x-dependency:
            ssl:
              value: enabled
        downinter:
          minimum: 0
          type:
          - integer
          - 'null'
          x-default-unit: ms
          x-duration: true
        error_limit:
          type:
          - integer
          - 'null'
          x-display-name: Healthcheck error limit
        fall:
          type:
          - integer
          - 'null'
          x-display-name: Nr. of consecutive failed checks
        fastinter:
          minimum: 0
          type:
          - integer
          - 'null'
          x-default-unit: ms
          x-duration: true
        force_sslv3:
          enum:
          - enabled
          - disabled
          type: string
        force_tlsv10:
          enum:
          - enabled
          - disabled
          type: string
        force_tlsv11:
          enum:
          - enabled
          - disabled
          type: string
        force_tlsv12:
          enum:
          - enabled
          - disabled
          type: string
        force_tlsv13:
          enum:
          - enabled
          - disabled
          type: string
        health_check_address:
          pattern: ^[^\s]+$
          type: string
        health_check_port:
          maximum: 65535
          minimum: 1
          type:
          - integer
          - 'null'
        id:
          readOnly: true
          type: string
        inter:
          minimum: 0
          type:
          - integer
          - 'null'
          x-default-unit: ms
          x-duration: true
        maintenance:
          enum:
          - enabled
          - disabled
          type: string
        maxconn:
          type:
          - integer
          - 'null'
          x-display-name: Max Concurrent Connections
        maxqueue:
          type:
          - integer
          - 'null'
          x-display-name: Max Number of Connections
        minconn:
          type:
          - integer
          - 'null'
        name:
          readOnly: true
          type: string
        no_sslv3:
          enum:
          - enabled
          - disabled
          type: string
        no_tlsv10:
          enum:
          - enabled
          - disabled
          type: string
        no_tlsv11:
          enum:
          - enabled
          - disabled
          type: string
        no_tlsv12:
          enum:
          - enabled
          - disabled
          type: string
        no_tlsv13:
          enum:
          - enabled
          - disabled
          type: string
        npn:
          type: string
          x-dependency:
            ssl:
              value: enabled
        observe:
          enum:
          - layer4
          - layer7
          type: string
          x-dependency:
            ssl:
              value: enabled
        on-error:
          enum:
          - fastinter
          - fail-check
          - sudden-death
          - mark-down
          type: string
        on-marked-down:
          enum:
          - shutdown-sessions
          type: string
        on-marked-up:
          enum:
          - shutdown-backup-sessions
          type: string
        pool_low_conn:
          type:
          - integer
          - 'null'
        pool_max_conn:
          type:
          - integer
          - 'null'
        pool_purge_delay:
          minimum: 0
          type:
          - integer
          - 'null'
          x-default-unit: ms
          x-duration: true
        port:
          maximum: 65535
          minimum: 1
          readOnly: true
          type:
          - integer
          - 'null'
        proto:
          pattern: ^[^\s]+$
          type: string
        proxy-v2-options:
          items:
            enum:
            - authority
            - cert-cn
            - cert-key

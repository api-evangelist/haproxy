              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/servers'
        default:
          $ref: '#/components/responses/DefaultError'
      summary: Return an array of servers
      tags:
      - Server
    post:
      description: Adds a new server in the specified backend in the configuration file.
      operationId: createServerRing
      parameters:
      - $ref: '#/components/parameters/parent_name'
      - $ref: '#/components/parameters/transaction_id'
      - $ref: '#/components/parameters/version'
      - $ref: '#/components/parameters/force_reload'
      responses:
        '201':
          description: Server created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/server'
        '202':
          description: Configuration change accepted and reload requested
          headers:
            Reload-ID:
              description: ID of the requested reload
              schema:
                type: string
          content:
            application/json:
              schema:
